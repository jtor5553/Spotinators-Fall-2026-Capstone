# Operator settings. Do not put the Spot password in this file.
# Remember stores it in config/operator.secret, which git ignores.
# Mock Spot is chosen only with the Mock mode checkbox on the connect page.

system:
  name: "Spot Cone Placement Controller"
  mock_mode: false

spot:
  hostname: ""
  username: ""

controller:
  type: "dualsense"
  deadman_trigger: "R2"

dispenser:
  enabled: true
  mock: false
  cone_capacity: 4
  motor_driver: "cytron_mdd10a"
  # Orin Nano wiring from TestingMotors: DIR pin 13 (line 122), PWM pin 32.
  dir_pin: 13
  pwm_pin: 32
  dir_line: 122
  motor_duty_percent: 60
  motor_pwm_hz: 20000

camera:
  width: 640
  height: 480
  fps: 10
  jpeg_quality: 50
  resize_ratio: 1.0

network:
  gui_host: "0.0.0.0"
  gui_port: 8000

movement:
  max_forward_speed: 0.6
  max_lateral_speed: 0.4
  max_rotation_speed: 0.6
