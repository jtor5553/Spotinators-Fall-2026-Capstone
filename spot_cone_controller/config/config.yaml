# Operator settings. Do not put the Spot password in this file.
# The password is entered on the tablet and kept in memory only.

system:
  name: "Spot Cone Placement Controller"
  mock_mode: true

spot:
  hostname: ""
  username: ""

controller:
  type: "dualsense"
  deadman_trigger: "R2"

dispenser:
