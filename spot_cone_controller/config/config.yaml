camera:
  width: 640
  height: 480
  fps: 5

network:
  gui_host: "0.0.0.0"
  gui_port: 8000

movement:
  max_forward_speed: 0.3
  max_lateral_speed: 0.2
  max_rotation_speed: 0.3
